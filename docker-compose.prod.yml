services:

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./api-gateway/.env.production
    environment:
      # Using the container/service names from your infra file
      RABBITMQ_URL: amqp://rabbitmq:5672
      REDIS_URL: redis://redis_project:6379
    ports:
      - "3000:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./product-service/.env.production
    environment:
      # Corrected hostname from 'mongodb' to 'mongodb_project'
      MONGO_URL: mongodb://root:secretpassword@mongodb_project:27017/products?authSource=admin
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./user-service/.env.production
    environment:
      MONGO_URL: mongodb://root:secretpassword@mongodb_project:27017/users?authSource=admin
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - "3002:3002"
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./order-service/.env.production
    environment:
      MONGO_URL: mongodb://root:secretpassword@mongodb_project:27017/orders?authSource=admin
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - "3003:3003"
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
